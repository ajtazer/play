<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>play.bihari.xyz</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#14120e; --panel:#24211a; --edge:#5b5547; --text:#e9e2cc; --dim:#a39a80; --neon:#1fb8ff; --army:#4b5a36; }
  * { box-sizing:border-box }
  html { background:var(--bg) }
  body { margin:0; min-height:100vh; color:var(--text); font-family:Oswald,sans-serif;
    background:radial-gradient(ellipse at top,#2c2619,var(--bg) 70%) fixed; }
  header { text-align:center; padding:40px 16px 8px }
  h1 { margin:0; font:400 clamp(36px,7vw,72px) "Black Ops One",sans-serif; letter-spacing:2px;
    color:#f4f4f4; text-shadow:0 0 2px #000,0 4px 0 #333 }
  h1 b { font-weight:400; color:var(--neon); text-shadow:0 0 18px #1fb8ffaa,0 4px 0 #0b4a6b }
  header p { margin:6px 0 0; color:var(--dim); letter-spacing:3px; text-transform:uppercase; font-size:14px }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; display:grid; gap:20px;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr)) }
  .card { all:unset; cursor:pointer; display:block; background:var(--panel); border:3px solid var(--edge);
    border-radius:6px; overflow:hidden; box-shadow:inset 0 0 0 2px #0006,0 6px 18px #0008; transition:transform .15s,border-color .15s }
  .card:hover,.card:focus-visible { transform:translateY(-3px); border-color:var(--neon); box-shadow:0 0 22px #1fb8ff55 }
  .card img { display:block; width:100%; aspect-ratio:3/2; object-fit:cover; background:#000 }
  .card div { padding:10px 14px; display:flex; justify-content:space-between; align-items:baseline;
    background:linear-gradient(#56643e,var(--army)); border-top:3px solid var(--edge) }
  .card h2 { margin:0; font-size:20px; text-transform:uppercase; letter-spacing:1px }
  .card span { color:#d6dcc4; font-size:13px }
  dialog { background:var(--panel); color:var(--text); border:3px solid var(--edge); border-radius:6px;
    padding:20px; width:min(760px,calc(100vw - 32px)) }
  dialog::backdrop { background:#000c }
  dialog h2 { margin:0 0 14px; font:400 28px "Black Ops One",sans-serif }
  .parts { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)) }
  .parts a { color:var(--text); text-decoration:none; border:2px solid var(--edge); border-radius:4px; overflow:hidden }
  .parts a:hover,.parts a:focus-visible { border-color:var(--neon) }
  .parts img { display:block; width:100%; aspect-ratio:3/2; object-fit:cover; background:#000 }
  .parts b { display:block; padding:6px 10px; font-weight:500; background:var(--army) }
  dialog form { text-align:right; margin-top:14px }
  dialog button { font:inherit; color:var(--text); background:var(--army); border:2px solid var(--edge); padding:4px 16px; cursor:pointer }
  footer { text-align:center; color:var(--dim); padding:0 16px 32px; font-size:14px; letter-spacing:2px }
  footer b { color:var(--neon) }
</style>

<header>
  <h1>PLAY.<b>BIHARI</b>.XYZ</h1>
  <p>Old Flash &amp; Shockwave games, playable again</p>
</header>
<main id="grid"></main>
<dialog id="pick"><h2></h2><div class="parts"></div><form method="dialog"><button>Close</button></form></dialog>
<footer>BROUGHT TO U BY <b>TAZER</b></footer>

<script>
const series = [
  ["Commando Assault", [["assault", "Commando Assault"]]],
  ["Metal Mayhem", [["metal-mayhem-world-tour","World Tour"],["metal-mayhem-2","Metal Mayhem 2"]]],
  ["Fancy Pants Adventures", [["fancy-pants-1","World 1"],["fancy-pants-2","World 2"],["fancy-pants-3","World 3"],
    ["fancy-pants-4-1","World 4 Part 1"],["fancy-pants-4-2","World 4 Part 2"],["fancy-pants-4-3","World 4 Part 3"]]],
  ["Crush the Castle", [["crush-the-castle-2","Crush the Castle 2"],["crush-the-castle","Crush the Castle"],
    ["crush-the-castle-players-pack","Players Pack"],["crush-the-castle-2-players-pack","2: Players Pack"],
    ["crush-the-castle-adventures","Adventures"],["crush-the-castle-td","TD"]]],
  ["Age of War", [["age-of-war-2","Age of War 2"],["age-of-war","Age of War"]]],
  ["Territory War", [["territory-war","Territory War"],["territory-war-3","Territory War 3"],["territory-war-online","Online"]]],
  ["Raft Wars", [["raft-wars-2","Raft Wars 2"],["raft-wars","Raft Wars"]]],
];
const thumb = slug => `thumbs/${slug}.jpg`;
const dlg = document.getElementById("pick");
for (const [name, games] of series) {
  const [first] = games;
  const card = document.createElement(games.length > 1 ? "button" : "a");
  card.className = "card";
  card.innerHTML = `<img src="${thumb(first[0])}" alt="" loading="lazy"><div><h2>${name}</h2><span>${games.length > 1 ? games.length + " games" : "Play"}</span></div>`;
  if (games.length === 1) card.href = first[0] + "/";
  else card.onclick = () => {
    dlg.querySelector("h2").textContent = name;
    dlg.querySelector(".parts").innerHTML = games.map(([s, t]) =>
      `<a href="${s}/"><img src="${thumb(s)}" alt="" loading="lazy"><b>${t}</b></a>`).join("");
    dlg.showModal();
  };
  document.getElementById("grid").append(card);
}
</script>
